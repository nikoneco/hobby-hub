<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="夜の司書さんがいる書斎から、いつものアプリへ。">
  <title>趣味HUB</title>
  <!-- HUB_PWA_HEAD -->
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand" aria-label="趣味HUB">
        <svg class="moon" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <path d="M23 4A16 16 0 1 0 34 28 15 15 0 0 1 23 4Z" fill="currentColor"/>
          <path d="M31 5v8m-4-4h8m1 9v5m-2.5-2.5h5M7 7v4m-2-2h4" stroke="currentColor" stroke-linecap="round"/>
        </svg>
        <span>趣味HUB</span>
      </div>
      <button id="lighting" class="lighting" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 2 2 3 4 2-1 12-5 2-5-2L6 7l4-2 2-3Zm-6 5h12M8 18h8m-4 3v1M10 8l-1 9m5-9 1 9"/>
          <path class="flame" d="M12 10c-.6 1.3-1.6 2.4-1.6 3.7a1.6 1.6 0 0 0 3.2 0c0-1.3-1-2.4-1.6-3.7Z" fill="currentColor" stroke="none"/>
        </svg>
        <span>灯り</span>
      </button>
    </header>

    <main class="study">
      <section class="welcome" aria-labelledby="title">
        <h1 id="title">夜の書斎</h1>
        <div class="ornament" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M8 0c.7 5.3 2.7 7.3 8 8-5.3.7-7.3 2.7-8 8C7.3 10.7 5.3 8.7 0 8c5.3-.7 7.3-2.7 8-8Z" fill="currentColor"/></svg>
        </div>
        <p class="greeting">
          <span id="flavor-text" aria-live="polite">おかえりなさい。<wbr>今日は何を開きますか？</span>
          <button id="flavor-trigger" class="flavor-trigger" type="button" aria-label="夜の司書さんのひとことを聞く" aria-describedby="flavor-text" title="夜の司書さんのひとことを聞く"></button>
        </p>
        <button id="open-catalog" class="catalog-trigger" type="button" aria-haspopup="dialog">
          <span>アプリ一覧</span>
          <svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 8h18m-6-6 6 6-6 6"/>
          </svg>
        </button>
      </section>

      <div class="room">
        <img class="room-art" src="./assets/night-study/night-study.webp" width="1448" height="1086" fetchpriority="high"
             alt="夜の司書さんが本を開いている書斎。左に本棚、机には小さな端末、右に月明かりが差す窓。">
        <div class="arrival-camera bookshelf-camera" aria-hidden="true">
          <img class="bookshelf-arrival" src="./assets/night-study/bookshelf-arrival.webp" width="1448" height="1086" alt="">
          <img class="bookshelf-face-before" src="./assets/night-study/bookshelf-before.webp" width="1448" height="1086" alt="">
          <img class="bookshelf-book-before" src="./assets/night-study/bookshelf-before.webp" width="1448" height="1086" alt="">
          <img class="bookshelf-book-moving" src="./assets/night-study/bookshelf-arrival.webp" width="1448" height="1086" alt="">
        </div>
        <div class="arrival-camera stop-camera" aria-hidden="true"></div>
        <div class="bookshelf-lamp" aria-hidden="true">
          <img src="./assets/night-study/foreground-lamp.webp" width="768" height="768" alt="">
        </div>
        <nav class="room-links" aria-label="書斎を見渡す">
          <button class="pin bookshelf" data-stop="bookshelf" type="button" aria-controls="destination">
            <span>趣味部屋図書館</span>
          </button>
          <button class="pin games" data-stop="games" type="button" aria-controls="destination">
            <span>ゲーム</span>
          </button>
          <button class="pin aviation" data-stop="aviation" type="button" aria-controls="destination">
            <span>737 Study Finder</span>
          </button>
          <button class="pin terminal" data-stop="terminal" type="button" aria-controls="destination">
            <span>暮らし</span>
          </button>
          <button class="pin window" data-stop="window" type="button" aria-controls="destination">
            <span>CelestiFrame</span>
          </button>
        </nav>
      </div>
      <section id="destination" class="destination" aria-labelledby="destination-title" hidden>
        <button id="return-room" class="return-room" type="button">
          <svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 8H4m6 6L4 8l6-6"/>
          </svg>
          書斎へ戻る
        </button>
        <div class="destination-content">
          <h2 id="destination-title" tabindex="-1"></h2>
          <p id="destination-description"></p>
          <ul id="destination-apps" class="destination-apps" hidden></ul>
          <a id="destination-launch" class="catalog-trigger destination-launch">
            <span>アプリを開く</span>
            <svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 8h18m-6-6 6 6-6 6"/>
            </svg>
          </a>
        </div>
      </section>
    </main>
  </div>

  <dialog id="catalog" aria-labelledby="catalog-heading">
    <div class="catalog-header">
      <h2 id="catalog-heading">アプリ一覧</h2>
      <form method="dialog">
        <button class="close-catalog" type="submit" aria-label="閉じる" autofocus>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </form>
    </div>
    <div class="catalog-filters" role="group" aria-label="アプリのカテゴリ">
      <button type="button" data-category="all" aria-controls="catalog-modules" aria-pressed="true">すべて</button>
      <button type="button" data-category="hobby" aria-controls="catalog-modules" aria-pressed="false">趣味</button>
      <button type="button" data-category="daily" aria-controls="catalog-modules" aria-pressed="false">日常</button>
      <button type="button" data-category="aviation" aria-controls="catalog-modules" aria-pressed="false">航空</button>
      <button type="button" data-category="game" aria-controls="catalog-modules" aria-pressed="false">ゲーム</button>
    </div>
    <nav aria-label="アプリ一覧">
      <section id="catalog-recent" class="catalog-section" aria-labelledby="recent-heading" hidden>
        <h3 id="recent-heading">最近使ったアプリ</h3>
        <ul></ul>
      </section>
      <div id="catalog-modules">
        <section class="catalog-section" data-category="hobby" aria-labelledby="hobby-heading" hidden>
          <h3 id="hobby-heading">趣味</h3>
          <ul></ul>
        </section>
        <section class="catalog-section" data-category="daily" aria-labelledby="daily-heading" hidden>
          <h3 id="daily-heading">日常</h3>
          <ul></ul>
        </section>
        <section class="catalog-section" data-category="aviation" aria-labelledby="aviation-heading" hidden>
          <h3 id="aviation-heading">航空</h3>
          <ul></ul>
        </section>
        <section class="catalog-section" data-category="game" aria-labelledby="games-heading" hidden>
          <h3 id="games-heading">ゲーム</h3>
          <ul></ul>
        </section>
        <section class="catalog-section" data-category="other" aria-labelledby="other-heading" hidden>
          <h3 id="other-heading">その他</h3>
          <ul></ul>
        </section>
        <p id="catalog-empty" role="status" hidden></p>
      </div>
    </nav>
  </dialog>

  <script type="application/json" id="hub-catalog">__HUB_CATALOG_JSON__</script>
  <!-- HUB_PWA_SCRIPTS -->
</body>
</html>
