<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #151b24;
    --panel-strong: #1d2633;
    --panel-soft: #101720;
    --text: #eef3f8;
    --muted: #9aa8b6;
    --line: #2a3544;
    --accent: #35c2a4;
    --accent-2: #f1b84b;
    --danger: #e0635f;
    --good: #6bcf88;
    --shadow: rgba(0, 0, 0, 0.28);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button {
    border: 1px solid var(--line);
    background: #202a37;
    color: var(--text);
    border-radius: 7px;
    padding: 9px 13px;
    font: inherit;
    cursor: pointer;
  }

  button:hover:not(:disabled) {
    border-color: rgba(53, 194, 164, 0.65);
    background: #243242;
  }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #06201a;
    font-weight: 800;
  }

  button.primary:hover:not(:disabled) {
    background: #56d6bb;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.45;
  }

  .topbar {
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 24px;
    background: #0f151d;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow {
    margin: 0 0 4px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0;
    text-transform: uppercase;
  }

  h1,
  h2,
  h3,
  p {
    margin-top: 0;
  }

  h1 {
    margin-bottom: 0;
    font-size: 23px;
  }

  h2 {
    margin-bottom: 0;
    font-size: 17px;
  }

  h3 {
    font-size: 16px;
  }

  .layout {
    padding: 16px;
  }

  .study-shell {
    max-width: 1500px;
    margin: 0 auto;
  }

  .study-controls,
  .question-panel,
  .answer-panel,
  .admin-tools {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 12px 34px var(--shadow);
  }

  .study-controls {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) minmax(320px, 620px);
    gap: 18px;
    align-items: end;
    padding: 16px;
    margin-bottom: 14px;
  }

  .study-actions {
    display: grid;
    grid-template-columns: minmax(120px, 180px) auto minmax(180px, 1fr);
    gap: 10px;
    align-items: end;
  }

  .action-large {
    min-height: 44px;
    font-size: 15px;
  }

  .focus-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.95fr);
    gap: 14px;
    align-items: start;
  }

  .question-panel,
  .answer-panel {
    min-height: 520px;
    padding: 16px;
  }

  .panel-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .question-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 16px;
  }

  #questionDetail h3 {
    margin: 0;
    font-size: 28px;
    line-height: 1.45;
    word-break: break-word;
  }

  .question-content {
    min-height: 230px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel-soft);
    padding: 22px;
  }

  .empty-state {
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
    padding: 24px;
    background: var(--panel-soft);
  }

  .answer-reveal-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0 14px;
    flex-wrap: wrap;
  }

  .reveal-button {
    min-width: 160px;
    min-height: 46px;
    font-size: 15px;
  }

  .muted {
    color: var(--muted);
    font-size: 13px;
  }

  .is-hidden {
    display: none !important;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .load-panel {
    grid-column: 1 / -1;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel-soft);
    padding: 10px;
  }

  .load-panel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }

  #questionLoadStatus {
    color: var(--text);
    font-weight: 800;
  }

  #questionLoadCount {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 12px;
  }

  .load-progress-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.35;
  }

  #questionLoadEta {
    flex: 0 0 auto;
    text-align: right;
  }

  .load-bar {
    height: 6px;
    margin-top: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: #283241;
  }

  .load-bar span {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
    transition: width 420ms cubic-bezier(0.22, 1, 0.36, 1), background-color 180ms ease;
  }

  .load-panel.is-pending .load-bar span {
    background: var(--accent-2);
  }

  .load-panel.is-loading .load-bar span {
    background: var(--accent);
  }

  .load-panel.is-loaded .load-bar span {
    background: var(--good);
  }

  .load-panel.is-failed .load-bar span {
    background: var(--danger);
  }

  @media (prefers-reduced-motion: reduce) {
    .load-bar span {
      transition: none;
    }
  }

  input,
  select,
  textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 9px;
    background: #0f151d;
    color: var(--text);
    font: inherit;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--accent);
    outline: 2px solid rgba(53, 194, 164, 0.18);
  }

  textarea {
    min-height: 170px;
    resize: vertical;
  }

  label {
    display: block;
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 13px;
  }

  .question-button {
    width: 100%;
    display: block;
    text-align: left;
    margin-bottom: 8px;
  }

  .question-button strong {
    display: block;
    margin-bottom: 8px;
    line-height: 1.45;
  }

  .question-list {
    max-height: 360px;
    overflow: auto;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }

  .question-list.is-collapsed {
    display: none;
  }

  .status {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    background: rgba(53, 194, 164, 0.13);
    color: var(--accent);
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 800;
  }

  .answer-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    margin: 10px 0;
    padding: 12px;
    background: var(--panel-soft);
  }

  .answer-figure {
    margin: 16px 0 0;
  }

  .answer-figure img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }

  .answer-figure figcaption {
    margin-top: 7px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }

  .answer-card.confirmed {
    border-color: rgba(107, 207, 136, 0.45);
    background: rgba(107, 207, 136, 0.1);
  }

  .answer-card summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
    font-weight: 800;
  }

  .answer-meta {
    color: var(--muted);
    font-size: 12px;
    margin: 8px 0;
  }

  .term-trigger {
    display: inline;
    border: 0;
    border-bottom: 1px dotted currentColor;
    border-radius: 3px;
    padding: 0 2px;
    background: rgba(53, 194, 164, 0.12);
    color: var(--accent);
    font: inherit;
    font-weight: 850;
    line-height: inherit;
    vertical-align: baseline;
  }

  .term-trigger:hover,
  .term-trigger:focus-visible {
    border-color: currentColor;
    background: rgba(53, 194, 164, 0.22);
    outline: 2px solid rgba(53, 194, 164, 0.25);
    outline-offset: 2px;
  }

  .term-dialog {
    width: min(620px, calc(100vw - 28px));
    max-height: min(760px, calc(100vh - 28px));
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0;
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
  }

  .term-dialog::backdrop {
    background: rgba(3, 8, 13, 0.72);
    backdrop-filter: blur(2px);
  }

  .term-dialog-card {
    padding: 20px;
  }

  .term-dialog-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }

  .term-dialog-header h2 {
    font-size: 24px;
  }

  .term-dialog-close {
    flex: 0 0 auto;
  }

  .term-details {
    display: grid;
    gap: 0;
    margin: 0;
  }

  .term-details > div {
    display: grid;
    grid-template-columns: 110px minmax(0, 1fr);
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }

  .term-details > div:last-child {
    border-bottom: 0;
  }

  .term-details dt {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
  }

  .term-details dd {
    margin: 0;
    line-height: 1.65;
    overflow-wrap: anywhere;
  }

  pre {
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
    color: var(--text);
    font-family: inherit;
    line-height: 1.6;
  }

  .candidate-details {
    margin-top: 14px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }

  .candidate-details > summary,
  .admin-tools > summary {
    cursor: pointer;
    color: var(--accent-2);
    font-weight: 800;
  }

  .candidate {
    border-top: 1px solid var(--line);
    padding: 12px 0;
  }

  .candidate:first-child {
    border-top: 0;
  }

  .candidate-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }

  .candidate-code {
    color: var(--accent-2);
    font-weight: 900;
  }

  .candidate-link {
    color: var(--accent);
    font-size: 12px;
    font-weight: 800;
    text-decoration: none;
  }

  .candidate-link.is-muted {
    color: var(--muted);
  }

  .admin-tools {
    margin-top: 14px;
    padding: 12px 14px;
  }

  .utility-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 0.8fr) minmax(260px, 0.7fr);
    gap: 14px;
    margin-top: 14px;
  }

  .utility-grid > section {
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
  }

  .check-label {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .check-label input {
    width: auto;
  }

  @media (max-width: 1100px) {
    .study-controls,
    .focus-grid,
    .utility-grid {
      grid-template-columns: 1fr;
    }

    .question-panel,
    .answer-panel {
      min-height: auto;
    }
  }

  @media (max-width: 700px) {
    .topbar,
    .study-controls,
    .question-panel,
    .answer-panel {
      padding: 14px;
    }

    .study-actions {
      grid-template-columns: 1fr;
    }

    #questionDetail h3 {
      font-size: 22px;
    }

    .panel-heading,
    .load-panel-row {
      align-items: flex-start;
      flex-direction: column;
    }

    .load-progress-meta {
      align-items: flex-start;
    }

    .term-dialog-card {
      padding: 17px;
    }

    .term-details > div {
      grid-template-columns: 1fr;
      gap: 5px;
    }
  }
</style>
