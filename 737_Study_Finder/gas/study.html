<section class="study-shell" aria-label="737 Study Finder">
  <section class="study-controls" aria-label="Study controls">
    <div>
      <p class="eyebrow">Study Mode</p>
      <h2>ATAを選んで、ランダムに解く</h2>
    </div>
    <div class="study-actions">
      <label>
        ATA
        <select id="ataFilter">
          <option value="">ATA All</option>
          <option value="21">ATA 21</option>
          <option value="24">ATA 24</option>
        </select>
      </label>
      <button id="loadQuestions">読み込み</button>
      <button id="randomQuestionButton" class="primary action-large">次のランダム問題</button>
    </div>
    <div id="questionLoadPanel" class="load-panel is-idle" aria-live="polite">
      <div class="load-panel-row">
        <span id="questionLoadStatus">ATAを選んで読み込みを押してください。</span>
        <span id="questionLoadCount">未読み込み</span>
      </div>
      <div class="load-bar" aria-hidden="true">
        <span id="questionLoadBar"></span>
      </div>
    </div>
  </section>

  <section class="focus-grid" aria-label="Study question and answer">
    <section class="question-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Question</p>
          <h2>まず自分で答える</h2>
        </div>
        <button id="toggleQuestionListButton" aria-expanded="false">問題一覧</button>
      </div>
      <div id="questionDetail" class="empty-state">問題を選択するか、ランダム出題を押してね。</div>
      <div class="answer-reveal-actions">
        <button id="revealAnswerButton" class="primary reveal-button" disabled>回答を見る</button>
        <span id="revealHint" class="muted">回答はまだ隠れています。</span>
      </div>
      <div id="questionList" class="muted question-list is-collapsed">初期設定後に問題を読み込みます。</div>
    </section>

    <section class="answer-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Answer</p>
          <h2>回答</h2>
        </div>
      </div>
      <div id="answerRevealPlaceholder" class="empty-state">問題を解いたら「回答を見る」で確認します。</div>
      <div id="answer" class="is-hidden"></div>
      <details id="candidateDetails" class="candidate-details is-hidden">
        <summary>PDF/根拠候補を見る</summary>
        <div id="candidateList" class="candidate-list">候補ページはここに表示します。</div>
      </details>
    </section>
  </section>

</section>
